// 통합 인물코드: 동일인 자동 병합 금지, 직원이 기존 코드를 선택한 경우에만 연결.
function peopleIndex(){const m=new Map();const add=(x,kind,where)=>{if(!x||!x.personCode)return;const code=x.personCode;let a=m.get(code);if(!a){a={code,names:new Set(),phones:new Set(),births:new Set(),addresses:new Set(),places:new Set(),kinds:new Set()};m.set(code,a)}if(x.name)a.names.add(x.name.trim());if(x.phone)a.phones.add(x.phone.replace(/\D/g,''));if(x.birth)a.births.add(x.birth.replace(/\D/g,''));if(x.address)a.addresses.add(x.address.replace(/\s/g,''));if(where)a.places.add(where);a.kinds.add(kind)};db.customers.forEach(c=>add(c,'고객',''));db.properties.forEach(p=>{const place=(p.parcels||[]).map(formatLot).filter(Boolean).join(', ');[...(p.landOwners||[]),...(p.buildingOwners||[])].forEach(o=>add(o,'소유주',place))});return [...m.values()]}
function newPersonCode(){const used=new Set(peopleIndex().map(x=>x.code));let n=1;while(used.has('P-'+String(n).padStart(6,'0')))n++;return 'P-'+String(n).padStart(6,'0')}
function candidatePeople(name,phone,birth,address,exclude=''){const n=(name||'').trim(),ph=(phone||'').replace(/\D/g,''),b=(birth||'').replace(/\D/g,''),a=(address||'').replace(/\s/g,'');return peopleIndex().filter(x=>x.code!==exclude&&n&&x.names.has(n)).map(x=>{const reasons=[];if(ph.length>=8&&x.phones.has(ph))reasons.push('연락처 일치');if(b.length>=8&&x.births.has(b))reasons.push('생년월일 일치');if(a.length>=6&&x.addresses.has(a))reasons.push('소유주 주소 일치');return {...x,reasons}}).filter(x=>x.reasons.length).sort((a,b)=>b.reasons.length-a.reasons.length)}
function personCandidateHtml(code,name,phone,birth,address){const candidates=candidatePeople(name,phone,birth,address,code);return candidates.length?'<div class="muted">동일인 후보 (자동 연결되지 않음): '+candidates.map(x=>esc(x.code)+' · '+esc(x.reasons.join('/'))+' · 연결 필지 '+esc([...x.places].join('; ')||'없음')).join(' | ')+'</div>':'<div class="muted">확인 가능한 동일인 후보 없음. 이름만 같으면 자동 연결하지 않습니다.</div>'}
function personOptions(current=''){return '<option value="">새 인물코드 발급 (저장 시)</option>'+(current?`<option value="${esc(current)}" selected>${esc(current)} · 현재 연결 코드</option>`:'')}
function bindPersonLookup(root){root.querySelectorAll('select[name="personCode"],select[name="ownerPersonCodeItem"]').forEach(sel=>{const wrap=document.createElement('div');wrap.style.cssText='margin:6px 0 10px';wrap.innerHTML='<div class="row"><input type="search" placeholder="기존 인물 이름·전화번호·코드 검색" style="min-width:210px"><button type="button" class="alt">기존 코드 찾기</button></div><div class="muted" data-person-results>기존 인물코드를 검색한 후 선택하세요. 이름만 같으면 연결하지 마세요.</div>';sel.parentElement.appendChild(wrap);const input=wrap.querySelector('input'),btn=wrap.querySelector('button'),result=wrap.querySelector('[data-person-results]');const find=()=>{const q=input.value.trim().toLowerCase();if(q.length<2){result.textContent='두 글자 이상 입력해 주세요.';return}const found=peopleIndex().filter(x=>[x.code,...x.names,...x.phones].some(v=>String(v).toLowerCase().includes(q))).slice(0,30);result.innerHTML=found.length?found.map(x=>`<p><button type="button" class="alt" data-person-code="${esc(x.code)}">${esc(x.code)} · ${esc([...x.names].join('/'))} · ${esc([...x.phones].join('/'))}</button></p>`).join(''):'일치하는 기존 코드가 없습니다.';result.querySelectorAll('[data-person-code]').forEach(b=>b.onclick=()=>{const code=b.dataset.personCode;if(![...sel.options].some(o=>o.value===code))sel.add(new Option(code+' · 선택한 기존 코드',code));sel.value=code;result.textContent=code+' 연결 선택됨 (저장 시 적용)'});};btn.onclick=find;input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();find()}}})}

function cleanRichHtml(raw){
 const template=document.createElement('template');template.innerHTML=String(raw||'');
 const allowed=new Set(['B','STRONG','I','EM','U','S','STRIKE','P','DIV','BR','UL','OL','LI','SPAN','FONT','H3','H4']);
 function visit(parent){for(const node of [...parent.childNodes]){if(node.nodeType===8){node.remove();continue}if(node.nodeType!==1)continue;const tag=node.tagName;if(!allowed.has(tag)){const txt=document.createTextNode(node.textContent||'');node.replaceWith(txt);continue}const color=(node.getAttribute('color')||node.style.color||'').trim();for(const a of [...node.attributes])node.removeAttribute(a.name);if((tag==='FONT'||tag==='SPAN')&&(/^#[0-9a-fA-F]{6}$/.test(color)||/^rgb\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}\s*\)$/.test(color)))node.style.color=color;visit(node)}}visit(template.content);return template.innerHTML;
}
function richField(name,content,placeholder){const safe=cleanRichHtml(content);return `<div class="rich-wrap" data-rich="${name}"><div class="rich-toolbar"><select data-rich-cmd="fontName" aria-label="글꼴"><option value="맑은 고딕">맑은 고딕</option><option value="Arial">Arial</option><option value="serif">명조</option></select><select data-rich-cmd="fontSize" aria-label="글자 크기"><option value="2">작게</option><option value="3" selected>보통</option><option value="4">크게</option><option value="5">더 크게</option></select><label class="rich-color-label" title="선택한 글씨 색상 변경">글씨색 <select data-rich-cmd="foreColor" aria-label="글씨 색상"><option value="#111827">⚫ 검정</option><option value="#dc2626">🔴 빨강</option><option value="#ea580c">🟠 주황</option><option value="#ca8a04">🟡 노랑</option><option value="#15803d">🟢 초록</option><option value="#2563eb">🔵 파랑</option><option value="#7c3aed">🟣 보라</option><option value="#64748b">⚪ 회색</option></select></label><button type="button" data-rich-cmd="bold"><b>굵게</b></button><button type="button" data-rich-cmd="italic"><i>기울임</i></button><button type="button" data-rich-cmd="underline"><u>밑줄</u></button><button type="button" data-rich-cmd="insertUnorderedList">• 목록</button><button type="button" data-rich-cmd="insertOrderedList">1. 목록</button><button type="button" data-rich-cmd="removeFormat">서식 지우기</button></div><div class="rich-editor" contenteditable="true" data-placeholder="${esc(placeholder)}">${safe}</div><textarea class="rich-source" name="${name}"></textarea></div>`}
function bindRichFields(root){root.querySelectorAll('.rich-wrap').forEach(w=>{const editor=w.querySelector('.rich-editor'),source=w.querySelector('.rich-source');let savedRange=null;const remember=()=>{const sel=window.getSelection();if(sel&&sel.rangeCount&&editor.contains(sel.anchorNode))savedRange=sel.getRangeAt(0).cloneRange()};const sync=()=>{source.value=editor.innerText||'';remember()};editor.addEventListener('mouseup',remember);editor.addEventListener('keyup',remember);editor.addEventListener('input',sync);editor.addEventListener('paste',e=>{e.preventDefault();const text=e.clipboardData.getData('text/plain');document.execCommand('insertText',false,text)});w.querySelectorAll('[data-rich-cmd]').forEach(control=>{if(control.tagName==='BUTTON')control.addEventListener('mousedown',e=>e.preventDefault());const act=()=>{editor.focus();if(savedRange){const sel=window.getSelection();sel.removeAllRanges();sel.addRange(savedRange)}document.execCommand(control.dataset.richCmd,false,control.value||null);sync()};control.addEventListener(control.tagName==='SELECT'?'change':'click',act)});sync()})}

const PY=3.305785;
const pyeongOf=v=>v===''||v==null?'':(Number(v)/PY).toFixed(2);

function areaPair(prefix,label,sqm='',extra=''){
 const shortLabel=label.replace('희망 ','').replace(' 최소',' 최소').replace(' 최대',' 최대');
 return `<div class="area-pair compact-area"><label>${shortLabel} (평)<input data-area-py="${prefix}" type="number" min="0" step="any" placeholder="평 입력" value="${esc(pyeongOf(sqm))}"></label><input data-area-sqm="${prefix}" name="${prefix}" type="hidden" value="${esc(sqm)}"><span class="area-converted" data-area-display="${prefix}">${sqm!==''&&sqm!=null?esc(Number(sqm).toLocaleString('ko-KR',{maximumFractionDigits:2}))+' ㎡':'㎡ 자동환산'}</span>${extra}</div>`;
}
function bindAreaPairs(root){
 root.querySelectorAll('[data-area-py]').forEach(py=>{
  const key=py.dataset.areaPy,sqm=root.querySelector(`[data-area-sqm="${key}"]`),display=root.querySelector(`[data-area-display="${key}"]`);
  if(!sqm)return;
  const sync=()=>{sqm.value=sqmOf(py.value);if(display)display.textContent=py.value===''?'㎡ 자동환산':Number(sqm.value).toLocaleString('ko-KR',{maximumFractionDigits:2})+' ㎡';sqm.dispatchEvent(new Event('change',{bubbles:true}))};
  py.addEventListener('input',sync);
 });
}
function parcelRow(p={}){return `<div class="parcelrow" draggable="false"><div class="parcel-sortbar"><span class="parcel-drag" draggable="true" title="잡고 드래그하여 순서 변경" aria-label="필지 순서 변경">☰ 순서 이동</span><span class="parcel-rank"></span><div class="parcel-sortbuttons"><button type="button" class="alt parcelUp" title="위로 이동">↑</button><button type="button" class="alt parcelDown" title="아래로 이동">↓</button></div></div><label>행정동<input name="dong" placeholder="예: 과림동" value="${esc(p.dong)}" required></label><label>산 여부<span class="parcel-check"><input type="checkbox" name="san" ${p.san?'checked':''}> 산</span></label><label>본번<input name="main" placeholder="본번" value="${esc(p.main)}" required></label><label>부번<input name="sub" placeholder="부번" value="${esc(p.sub)}"></label><label>지목<input name="landUse" placeholder="지목" value="${esc(p.landUse)}"></label><label>면적 (평)<input data-parcel-py type="number" min="0" step="any" placeholder="평" value="${esc(pyeongOf(p.sqm))}"></label><label>면적 (㎡)<input name="sqm" type="number" min="0" step="any" placeholder="㎡" value="${esc(p.sqm)}"></label><div class="parcel-actions"><button type="button" class="alt removeParcel pillbutton">필지 삭제</button></div></div>`}
function floorRow(x={}){return `<div class="lm-floor-row"><label>층 구분<input name="levelName" placeholder="예: 1층, 2층, 지하 1층" value="${esc(x.levelName||'')}"></label><label>해당 층 용도<input name="levelUse" placeholder="예: 공장, 사무실" value="${esc(x.levelUse||'')}"></label><label>면적 (평)<input data-level-py type="number" min="0" step="any" value="${esc(pyeongOf(x.sqm))}"></label><label>면적 (㎡)<input name="levelSqm" type="number" min="0" step="any" value="${esc(x.sqm||'')}"></label><button type="button" class="alt removeFloor">삭제</button></div>`}
function buildingRow(b={}){return `<div class="buildingrow"><div class="building-grid"><label>건물동 / 명칭<input name="buildingName" value="${esc(b.buildingName)}" placeholder="A동, 주건물 등"></label><label>건물 용도<input name="buildingUse" value="${esc(b.buildingUse)}" placeholder="제조업소, 창고시설 등"></label><label>건축면적 (평)<input data-building-py="footprint" type="number" min="0" step="any" value="${esc(pyeongOf(b.footprintSqm))}"></label><label>건축면적 (㎡)<input name="footprintSqm" type="number" min="0" step="any" value="${esc(b.footprintSqm)}"></label><label>사용승인일<input name="approvalDate" placeholder="YYYY-MM-DD" value="${esc(b.approvalDate)}"></label></div><div class="lm-floor-section"><b>이 건물동의 층별 정보</b><p class="muted">1층·2층·지하층을 각각 추가하세요. 층별 면적을 합산해 연면적을 계산합니다.</p><div class="lm-floor-rows">${(Array.isArray(b.levels)&&b.levels.length?b.levels:[{}]).map(floorRow).join('')}</div><button type="button" class="alt addFloor">+ 층 추가</button><div class="lm-building-floor-total">층별 연면적 합계: <strong>0.00평 (0㎡)</strong></div><div class="lm-legacy-floor" ${Array.isArray(b.levels)&&b.levels.length?'hidden':''}><label>기존 연면적 (㎡) · 층별 면적을 입력하면 자동으로 대체됩니다<input name="legacyFloorSqm" type="number" min="0" step="any" value="${esc(b.floorSqm)}"></label></div></div><div class="building-actions"><button type="button" class="alt removeBuilding">건물동 삭제</button></div></div>`}
function parseBuildings(f){return [...f.querySelectorAll('.buildingrow')].map(r=>{const get=n=>r.querySelector('[name="'+n+'"]')?.value.trim()||'';const levels=[...r.querySelectorAll('.lm-floor-row')].map(z=>({levelName:z.querySelector('[name=levelName]').value.trim(),levelUse:z.querySelector('[name=levelUse]').value.trim(),sqm:z.querySelector('[name=levelSqm]').value.trim()})).filter(z=>z.levelName||z.levelUse||z.sqm);const floorSqm=levels.length?String(levels.reduce((n,z)=>n+(Number(z.sqm)||0),0)):get('legacyFloorSqm');return {buildingName:get('buildingName'),buildingUse:get('buildingUse'),structure:'',floors:levels.map(z=>z.levelName).filter(Boolean).join(', '),footprintSqm:get('footprintSqm'),floorSqm,approvalDate:get('approvalDate'),levels}}).filter(b=>b.buildingName||b.buildingUse||b.footprintSqm||b.floorSqm||b.approvalDate||b.levels.length)}
function bindBuildings(){const f=$('#propertyForm');if(!f)return;const area=$('#buildingFields');function totals(){for(const r of area.querySelectorAll('.buildingrow')){const levels=[...r.querySelectorAll('.lm-floor-row')].filter(z=>z.querySelector('[name=levelName]').value.trim()||z.querySelector('[name=levelUse]').value.trim()||z.querySelector('[name=levelSqm]').value.trim());const sqm=levels.length?levels.reduce((n,z)=>n+(Number(z.querySelector('[name=levelSqm]').value)||0),0):Number(r.querySelector('[name=legacyFloorSqm]').value)||0;r.querySelector('.lm-building-floor-total strong').textContent=(sqm/PY).toFixed(2)+'평 ('+sqm.toLocaleString('ko-KR',{maximumFractionDigits:2})+'㎡)';r.querySelector('.lm-legacy-floor').hidden=levels.length>0}const list=parseBuildings(f),floor=list.reduce((n,b)=>n+(Number(b.floorSqm)||0),0),foot=list.reduce((n,b)=>n+(Number(b.footprintSqm)||0),0);$('#buildingTotal').innerHTML=`<div class="area-metric"><span>전체 건축면적 합계</span><b>${(foot/PY).toFixed(2)}평</b> <small>(${foot.toLocaleString('ko-KR',{maximumFractionDigits:2})}㎡)</small></div><div class="area-metric"><span>전체 연면적 합계 · ${list.length}개 동</span><b>${(floor/PY).toFixed(2)}평</b> <small>(${floor.toLocaleString('ko-KR',{maximumFractionDigits:2})}㎡)</small></div>`}area.addEventListener('input',e=>{const r=e.target.closest('.buildingrow');if(!r)return;const x=e.target;if(x.dataset.levelPy!==undefined){x.closest('.lm-floor-row').querySelector('[name=levelSqm]').value=sqmOf(x.value)}else if(x.name==='levelSqm'){x.closest('.lm-floor-row').querySelector('[data-level-py]').value=pyeongOf(x.value)}else if(x.dataset.buildingPy==='footprint'){r.querySelector('[name=footprintSqm]').value=sqmOf(x.value)}else if(x.name==='footprintSqm'){r.querySelector('[data-building-py=footprint]').value=pyeongOf(x.value)}totals()});area.addEventListener('click',e=>{const t=e.target;if(t.classList.contains('addFloor')){t.closest('.buildingrow').querySelector('.lm-floor-rows').insertAdjacentHTML('beforeend',floorRow());totals()}else if(t.classList.contains('removeFloor')){t.closest('.lm-floor-row').remove();totals()}else if(t.classList.contains('removeBuilding')){if(area.children.length===1){alert('건물이 없는 토지 매물은 건물정보를 빈칸으로 두세요.');return}t.closest('.buildingrow').remove();totals()}});$('#addBuilding').onclick=()=>{area.insertAdjacentHTML('beforeend',buildingRow());totals()};totals()}

function ownerRow(o={},kind='land'){return `<div class="ownerrow" data-kind="${kind}" style="border:1px solid #cbd8df;border-radius:9px;padding:12px;margin:9px 0"><div class="grid"><label>소유주명<input name="ownerNameItem" value="${esc(o.name)}"></label><label>통합 인물코드<select name="ownerPersonCodeItem">${personOptions(o.personCode)}</select></label><label>생년월일<input name="ownerBirthItem" placeholder="YYYY-MM-DD" value="${esc(o.birth)}"></label><label>주소<input name="ownerAddressItem" value="${esc(o.address)}"></label><label>연락처<input name="ownerPhoneItem" value="${esc(o.phone)}"></label><label>지분<input name="ownerShareItem" placeholder="예: 1/2, 50%" value="${esc(o.share)}"></label></div><div data-person-candidates class="area-summary"></div><button type="button" class="alt removeOwner" style="margin-top:8px">이 소유주 삭제</button></div>`}
function parseOwners(f,kind){return [...f.querySelectorAll('.ownerrow[data-kind="'+kind+'"]')].map(r=>{const v=n=>r.querySelector('[name="'+n+'"]').value.trim();return {name:v('ownerNameItem'),birth:v('ownerBirthItem'),address:v('ownerAddressItem'),phone:v('ownerPhoneItem'),share:v('ownerShareItem'),personCode:v('ownerPersonCodeItem')||'__NEW__'}}).filter(o=>[o.name,o.birth,o.address,o.phone,o.share].some(Boolean))}
function bindOwners(){const f=$('#propertyForm');if(!f)return;for(const kind of ['land','building']){const area=f.querySelector('#'+kind+'OwnerFields');const bind=()=>{area.querySelectorAll('.removeOwner').forEach(b=>b.onclick=()=>{b.closest('.ownerrow').remove()});area.querySelectorAll('.ownerrow').forEach(r=>{if(r.dataset.personBound)return;r.dataset.personBound='1';bindPersonCandidates(r,{code:'ownerPersonCodeItem',name:'ownerNameItem',phone:'ownerPhoneItem',birth:'ownerBirthItem',address:'ownerAddressItem',watch:['ownerNameItem','ownerPhoneItem','ownerBirthItem','ownerAddressItem']})})};f.querySelector('#add'+(kind==='land'?'Land':'Building')+'Owner').onclick=()=>{area.insertAdjacentHTML('beforeend',ownerRow({},kind));bind()};bind()}}

function manualPriceRow(x={}){return `<div class="lm-manual-price-row"><label>변경일<input type="date" data-mp="date" value="${esc(x.date||today())}"></label><label>구분<select data-mp="kind">${['매매가','보증금','월세'].map(k=>`<option ${x.kind===k?'selected':''}>${k}</option>`).join('')}</select></label><label>이전 금액 (만원)<input type="number" data-mp="oldPrice" value="${esc(x.oldPrice)}"></label><label>변경 금액 (만원)<input type="number" data-mp="newPrice" value="${esc(x.newPrice)}"></label><label>변경 사유<input data-mp="note" value="${esc(x.note)}"></label><button type="button" class="alt lm-mp-remove">삭제</button><input type="hidden" data-mp="id" value="${esc(x.id)}"></div>`}
function readManualPrices(f){return [...f.querySelectorAll('.lm-manual-price-row')].map(r=>{const val=k=>r.querySelector(`[data-mp="${k}"]`).value;return {id:val('id')||id(),date:val('date'),kind:val('kind'),oldPrice:val('oldPrice'),newPrice:val('newPrice'),note:val('note'),staff:typeof authStaffName!=='undefined'?authStaffName:''}}).filter(x=>x.oldPrice!==''||x.newPrice!==''||x.note.trim())}
function bindManualPrices(){const holder=$('#manualPriceRows');if(!holder)return;const bind=()=>holder.querySelectorAll('.lm-mp-remove').forEach(b=>b.onclick=()=>b.closest('.lm-manual-price-row').remove());$('#addManualPrice').onclick=()=>{holder.insertAdjacentHTML('beforeend',manualPriceRow());bind()};bind()}
function propertyPriceHistoryRows(p={}){const rows=[...(p.priceHistory||[]).map(x=>({...x,kind:'매매가'})),...(p.leasePriceHistory||[]).map(x=>({...x,kind:x.kind||'임대금액'})),...(p.manualPriceHistory||[])].sort((a,b)=>String(a.date||a.at||'').localeCompare(String(b.date||b.at||''))||String(a.at||'').localeCompare(String(b.at||'')));if(!rows.length)return '<p class="muted">아직 기록된 금액 변경이 없습니다.</p>';return `<div class="tablewrap"><table class="lm-price-table"><thead><tr><th>변경일</th><th>구분</th><th>이전 금액</th><th>변경 금액</th><th>변경 사유</th><th>담당</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.date||String(x.at||'').slice(0,10))}</td><td>${esc(x.kind)}</td><td>${x.oldPrice!==''&&x.oldPrice!=null?esc(Number(x.oldPrice).toLocaleString('ko-KR'))+'만원':'최초 등록'}</td><td>${x.newPrice!==''&&x.newPrice!=null?esc(Number(x.newPrice).toLocaleString('ko-KR'))+'만원':'미입력'}</td><td>${esc(x.note||'—')}</td><td>${esc(x.staff||'—')}</td></tr>`).join('')}</tbody></table></div>`}
function propertyForm(p={}){return `<form id="propertyForm"><input type="hidden" name="id" value="${esc(p.id)}"><h3>기본정보 · 거래조건</h3><div class="grid"><label>매물명 (선택)<input name="title" value="${esc(p.title)}" placeholder="대표 지번으로 자동 생성"></label><label>거래유형<select name="type">${['매매','임대','매매·임대'].map(x=>`<option ${p.type===x?'selected':''}>${x}</option>`).join('')}</select></label><label>연결 고객 / 소유주<select name="customerId">${opts('customers',p.customerId)}</select></label><label>보증금 (만원)<input name="deposit" type="number" min="0" step="any" value="${esc(p.deposit)}"></label><label>월세 (만원)<input name="rent" type="number" min="0" step="any" value="${esc(p.rent)}"></label><label>매매가 (만원)<input name="salePrice" type="number" min="0" step="any" value="${esc(p.salePrice)}"><small class="muted">저장할 때 이전 금액과 달라지면 변동이력이 자동 기록됩니다.</small></label><label>토지 평당가 (만원/평)<input name="land_price_per_pyeong" type="number" min="0" step="any" value="${esc(p.land_price_per_pyeong)}" placeholder="매매가와 토지면적 입력 시 자동계산"><small class="muted">자동 계산 · 이 칸에서 직접 수정 가능</small></label><label>대표 담당직원 (미지정 가능)<select name="staff"><option value="">담당자 미지정</option>${STAFF.map(x=>`<option value="${x}" ${p.staff===x?'selected':''}>${x}</option>`).join('')}</select></label><label>매매진행 상태<select name="saleStatus">${['','진행중','완료','보류'].map(x=>`<option value="${x}" ${p.saleStatus===x?'selected':''}>${x||'진행 안 함'}</option>`).join('')}</select></label><label>임대진행 상태<select name="leaseStatus">${['','진행중','완료','보류'].map(x=>`<option value="${x}" ${p.leaseStatus===x?'selected':''}>${x||'진행 안 함'}</option>`).join('')}</select></label><label>정보 확인일<input name="confirmedDate" type="date" value="${esc(p.confirmedDate)}"></label></div><h3>공동담당자</h3><div class="checks">${STAFF.map(x=>`<label><input name="coStaff" type="checkbox" value="${x}" ${(p.coStaff||[]).includes(x)?'checked':''}>${x}</label>`).join('')}</div><h3>① 매물 핵심정보 · 면적 합계</h3><div class="lm-top-summaries"><div><strong>전체 토지면적</strong><div id="parcelTotal" class="area-summary" role="status" aria-live="polite"></div></div><div><strong>전체 건물면적 · 연면적</strong><div id="buildingTotal" class="area-summary" role="status" aria-live="polite"></div></div></div><p class="muted">위 면적은 아래 상세 필지·건물 정보를 입력하면 자동으로 계산됩니다. 매매가·임대료는 위 거래조건에서 확인할 수 있습니다.</p><h3>② 금액 변경이력</h3><p class="muted">매매가·보증금·월세를 수정해 저장하면 변경 전후 금액과 날짜가 기록됩니다. 기존 기록은 유지됩니다.</p><div class="lm-price-change-meta"><label>금액 변경일 <input name="priceChangeDate" type="date" value="${today()}"></label><label>이번 변경 사유 <input name="priceChangeNote" placeholder="예: 소유주 요청으로 인하"></label><input type="hidden" name="price" value="${esc(p.price)}"></div><div class="lm-manual-history"><div id="manualPriceRows">${(p.manualPriceHistory||[]).map(manualPriceRow).join('')}</div><button type="button" class="alt" id="addManualPrice">+ 금액 변경이력 추가</button><p class="muted">과거 금액 변경도 한 건씩 직접 입력할 수 있습니다. 입력한 내역은 저장 후 날짜순으로 표시됩니다.</p></div><div class="lm-price-history" aria-label="날짜별 금액 변경이력">${propertyPriceHistoryRows(p)}</div><h3>③ 설비 · 기타정보 · 상세내용</h3><div class="grid"><label>호이스트<input name="hoist" placeholder="유무 및 용량" value="${esc(p.hoist)}"></label><label>전기 (kW)<input name="electricity" value="${esc(p.electricity)}"></label><label>정화조<input name="septic" value="${esc(p.septic)}"></label><label>진입차량<input name="vehicle" value="${esc(p.vehicle)}"></label><label>입주가능일<input name="availableDate" value="${esc(p.availableDate)}"></label></div><label>관리비 (만원)<input name="maintenance" value="${esc(p.maintenance)}" placeholder="월 관리비"></label><label>매물 상세내용${richField("note",p.noteRich||p.note||"","매물 상세내용을 입력하세요.")}</label><h3>④ 토지정보 · 필지별 입력</h3><p class="muted">각 필지마다 행정동을 별도로 입력합니다. 첫 번째 필지가 대표필지입니다. 다른 행정동 필지를 추가해도 해당 행정동 검색에 함께 나타납니다.</p><div id="parcelFields">${(p.parcels?.length?p.parcels:[{}]).map(parcelRow).join('')}</div><button type="button" class="alt" id="addParcel">+ 필지 추가</button><h3>⑤ 건물정보 · 건물동별 입력</h3><p class="muted">토지와 건물은 같은 매물에서 관리합니다. 건물이 없으면 아래 입력칸을 비워 두세요.</p><div id="buildingFields">${(p.buildings?.length?p.buildings:[p.buildingSqm?{floorSqm:p.buildingSqm}:{}]).map(buildingRow).join('')}</div><button type="button" class="alt" id="addBuilding">+ 건물동 추가</button><h3>⑥ 토지 소유주 · 지분</h3><p class="muted">여러 소유주를 등록할 수 있습니다. 지분은 등기부 기준으로 입력하세요.</p><div id="landOwnerFields">${(p.landOwners?.length?p.landOwners:[p.ownerName?{name:p.ownerName,birth:p.ownerBirth,address:p.ownerAddress,phone:p.ownerPhone}:{}]).map(o=>ownerRow(o,'land')).join('')}</div><button type="button" class="alt" id="addLandOwner">+ 토지 소유주 추가</button><h3>⑦ 건물 소유주 · 지분</h3><div id="buildingOwnerFields">${(p.buildingOwners?.length?p.buildingOwners:[{}]).map(o=>ownerRow(o,'building')).join('')}</div><button type="button" class="alt" id="addBuildingOwner">+ 건물 소유주 추가</button><div class="row"><button type="submit">전체매물에 저장</button><button type="button" class="alt" id="newProperty">새로 입력</button></div></form>`}
function parseParcels(form){return [...form.querySelectorAll('.parcelrow')].map(r=>({dong:r.querySelector('[name=dong]').value.trim(),san:r.querySelector('[name=san]').checked,main:r.querySelector('[name=main]').value.trim(),sub:r.querySelector('[name=sub]').value.trim(),landUse:r.querySelector('[name=landUse]').value.trim(),sqm:r.querySelector('[name=sqm]').value.trim()})).filter(p=>p.dong||p.main)}function bindParcels(){const f=$('#propertyForm');
 const list=$('#parcelFields');let dragged=null;
 function updateRanks(){[...list.querySelectorAll('.parcelrow')].forEach((r,i)=>{r.querySelector('.parcel-rank').textContent=i===0?'대표필지 · 1번':(i+1)+'번 필지';r.classList.toggle('representative',i===0);r.querySelector('.parcelUp').disabled=i===0;r.querySelector('.parcelDown').disabled=i===list.querySelectorAll('.parcelrow').length-1})}
 list.addEventListener('dragstart',e=>{const handle=e.target.closest('.parcel-drag');if(!handle)return;dragged=handle.closest('.parcelrow');dragged.classList.add('parcel-moving');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','parcel-order')});
 list.addEventListener('dragover',e=>{if(!dragged)return;const target=e.target.closest('.parcelrow');if(!target||target===dragged)return;e.preventDefault();e.dataTransfer.dropEffect='move';const mid=target.getBoundingClientRect().top+target.getBoundingClientRect().height/2;list.insertBefore(dragged,e.clientY<mid?target:target.nextSibling);updateRanks()});
 list.addEventListener('drop',e=>{if(!dragged)return;e.preventDefault();dragged.classList.remove('parcel-moving');dragged=null;updateRanks();total()});
 list.addEventListener('dragend',()=>{if(dragged)dragged.classList.remove('parcel-moving');dragged=null;updateRanks();total()});
 list.addEventListener('click',e=>{const up=e.target.closest('.parcelUp'),down=e.target.closest('.parcelDown');if(!up&&!down)return;const r=e.target.closest('.parcelrow');if(up&&r.previousElementSibling)list.insertBefore(r,r.previousElementSibling);if(down&&r.nextElementSibling)list.insertBefore(r.nextElementSibling,r);updateRanks();total()});

f.addEventListener('input',e=>{
 const r=e.target.closest('.parcelrow');if(!r)return;
 const py=r.querySelector('[data-parcel-py]'),sqm=r.querySelector('[name=sqm]');
 if(e.target===py)sqm.value=sqmOf(py.value);

function calendarView(){const [y,m]=month.split('-').map(Number),first=new Date(y,m-1,1),start=first.getDay(),days=new Date(y,m,0).getDate();let cells='';for(let i=0;i<42;i++){const n=i-start+1,valid=n>0&&n<=days,d=`${month}-${String(n).padStart(2,'0')}`,items=db.schedules.filter(x=>x.date===d);cells+=`<div class="day ${valid?'':'off'} ${d===today()?'today':''}" ${valid?`data-day="${d}"`:''}><b>${valid?n:''}</b>${valid?items.slice(0,3).map(x=>`<div class="event" style="background:${/^#[0-9a-fA-F]{6}$/.test(x.color||"")?x.color:"#d6eceb"};color:${["#374151","#1f2937","#334155"].includes(x.color)?"#fff":"#142b35"}">${x.important?"★ ":""}${esc(x.sticker||"")}${esc(x.content)}</div>`).join(''):''}</div>`}$('#view').innerHTML=`<div class="panel"><div class="row"><h2>일정관리 · 월간 달력</h2><button class="alt" id="prevYear" title="1년 전">« 1년 전</button><button class="alt" id="prevMonth" title="이전 달">◀</button><label class="cal-jump-label">연도 <input id="calendarYear" type="number" min="1900" max="2100" step="1" value="${y}" aria-label="이동할 연도"></label><label class="cal-jump-label">월 <input id="calendarMonth" type="number" min="1" max="12" step="1" value="${m}" aria-label="이동할 월"></label><button class="alt" id="calendarGo" type="button">이동</button><button class="alt" id="nextMonth" title="다음 달">▶</button><button class="alt" id="nextYear" title="1년 후">1년 후 »</button><button class="alt" id="thisMonth">이번 달</button></div><div class="calendar">${['일','월','화','수','목','금','토'].map(x=>`<div style="text-align:center;font-weight:bold">${x}</div>`).join('')}${cells}</div><p class="muted">날짜를 클릭하면 해당 날짜로 일정 등록</p></div><div class="panel"><h2>일정 등록·수정</h2><form id="scheduleForm"><input type="hidden" name="id"><div class="grid"><label>일정일 *<input name="date" type="date" required value="${day}"></label><label>시작시간<input name="time" type="time"></label><label>종료시간<input name="endTime" type="time"></label><label>종일 <input name="allDay" type="checkbox" style="width:auto"></label><label>장소<input nam .value);if(!Number.isInteger(yy)||yy<1900||yy>2100||!Number.isInteger(mm)||mm<1||mm>12){alert('연도는 1900~2100, 월은 1~12로 입력해 주세요.');return}month=`${yy}-${String(mm).padStart(2,'0')}`;render()};$('#calendarGo').onclick=goCalendar;$('#calendarYear').onkeydown=$('#calendarMonth').onkeydown=e=>{if(e.key==='Enter')goCalendar()};$('#thisMonth').onclick=()=>{month=today().slice(0,7);render()};$('#view').querySelectorAll('[data-day]').forEach(x=>x.onclick=()=>{$('#scheduleForm [name=date]').value=x.dataset.day;day=x.dataset.day;$('#scheduleForm').scrollIntoView({behavior:'smooth'})});const sf=$('#scheduleForm');const selectScheduleColor=(color)=>{sf.elements.color.value=color;sf.querySelectorAll('.schedule-swatch').forEach(b=>{const active=b.dataset.color.toLowerCase()===String(color).toLowerCase();b.classList.toggle('selected',active);b.setAttribute('aria-pressed',String(active))})};sf.querySelectorAll('.schedule-swatch').forEach(b=>b.onclick=()=>selectScheduleColor(b.dataset.color));selectScheduleColor(sf.elements.color.value);const syncAllDay=()=>{const all=sf.elements.allDay.checked;sf.elements.time.disabled=all;sf.elements.endTime.disabled=all;if(all){sf.elements.time.value='';sf.elements.endTime.value=''}};sf.elements.allDay.onchange=syncAllDay;$('#scheduleMapOpen').onclick=()=>{const place=sf.elements.place.value.trim();if(!place){alert('장소를 먼저 입력해 주세요.');return}window.open('https://map.naver.com/p/search/'+encodeURIComponent(place),'_blank','noopener,noreferrer')};$('#scheduleForm').onsubmit=e=>{e.preventDefault();const o=formObj(e.target);o.allDay=e.target.elements.allDay.checked;o.important=e.target.elements.important.checked;if(o.allDay){o.time='';o.endTime=''}if(o.time&&o.endTime&&o.endTime<o.time){alert('종료시간이 시작시간보다 빠릅니다.');return}if(o.id){db.schedules=db.schedules.map(x=>x.id===o.id?{...x,...o}:x)}else{db.schedules.push({...o,id:id()})}day=o.date;save()};$('#scheduleNew').onclick=()=>{$('#scheduleForm').reset();$('#scheduleForm [name=id]').value='';selectSchedu function openSchedule(k){const s=get('schedules',k);if(!s)return;tab='calendar';month=s.date.slice(0,7);render();const f=$('#scheduleForm');Object.entries(s).forEach(([key,val])=>{if(f.elements[key]){if(f.elements[key].type==='checkbox')f.elements[key].checked=!!val;else f.elements[key].value=val}});f.elements.time.disabled=!!s.allDay;f.elements.endTime.disabled=!!s.allDay;f.querySelectorAll('.schedule-swatch').forEach(b=>{const selected=b.dataset.color.toLowerCase()===(s.color||'#d6eceb').toLowerCase();b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',String(selected))});f.insertAdjacentHTML('beforeend',`<div class="row"><button type="button" id="doneSchedule" class="alt">${s.done?'미완료로 변경':'완료 처리'}</button></div>`);$('#doneSchedule').onclick=()=>{s.done=!s.done;save()};f.scrollIntoView({behavior:'smooth'})}

function matchNumber(v){if(v===undefined||v===null||String(v).trim()==='')return null;const n=Number(v);return Number.isFinite(n)?n:null}
function budgetLimit(raw){const t=String(raw||'').replace(/,/g,'').trim();if(!t)return null;let m=t.match(/(\d+(?:\.\d+)?)\s*억(?:\s*(\d+)\s*만?)?/);if(m)return Math.round(Number(m[1])*10000+Number(m[2]||0));m=t.match(/(\d+(?:\.\d+)?)\s*만원?/);if(m)return Number(m[1]);if(/^\d+(?:\.\d+)?$/.test(t))return Number(t);return null}
function matchPair(c,p,kind){const checks=[],unknown=[],fail=[];const test=(name,pass)=>{checks.push(name);if(!pass)fail.push(name)};const unknownField=name=>unknown.push(name);
 const areas=(p.parcels||[]).reduce((a,x)=>a+(Number(x.sqm)||0),0),buildings=(p.buildings||[]).reduce((a,x)=>a+(Number(x.floorSqm)||0),0)||Number(p.buildingSqm)||0;
 const dong=(p.parcels||[]).map(x=>x.dong).filter(Boolean);
 // Only match a structured region when the customer supplied one; don't infer it from freeform notes.
 const regions=String(c.wantedRegions||'').split(/[,，/、\n]/).map(x=>x.trim()).filter(Boolean);
 if(regions.length){if(dong.length)test('지역',regions.some(x=>dong.includes(x)));else unknownField('지역')}
 const compareArea=(label,value,min,max)=>{const lo=matchNumber(min),hi=matchNumber(max);if(lo===null&&hi===null)return;if(!value){unknownField(label);return}test(label,(lo===null||value>=lo)&&(hi===null||value<=hi))};
 compareArea('토지면적',areas,c.wantedLandMin,c.wantedLandMax);compareArea('건물면적',buildings,c.wantedBuildingMin,c.wantedBuildingMax);
 const budget=budgetLimit(c.budget);if(kind==='sale'){const price=matchNumber(p.salePrice);if(budget!==null){if(price===null)unknownField('매매가');else test('매매가',price<=budget)}}else if(String(c.budget||'').trim())unknownField('고객 예산 형식');
 else {const rent=matchNumber(p.rent),deposit=matchNumber(p.deposit);if(budget!==null){if(rent===null)unknownField('월세');else test('월세',rent<=budget)}else if(String(c.budget||'').trim())unknownField('임대 예산 구분');if(deposit===null)unknownField('보증금 확인')}
 if(c.vehicle){if(p.vehicle)test('진입차량',String(p.vehicle).includes(String(c.vehicle).trim()));else unknownField('진입차량')}
 return {checks,unknown,fail,score:checks.length?Math.round(100*(checks.length-fail.length)/checks.length):null,ok:fail.length===0};}
function matchingView(){let mode='lease',direction='customer';$('#view').innerHTML=`<div class="panel"><h2>물건 ↔ 고객 매칭</h2><p class="muted">기존 고객관리와 전체매물의 데이터를 조회합니다. 이 화면에서는 새 고객이나 매물을 등록하지 않습니다.</p><div class="row"><label>매칭 종류<select id="mMode"><option value="lease">임대진행중 물건 ↔ 임차 고객</option><option value="sale">매매진행중 물건 ↔ 매수 고객</option></select></label><label>조회 방향<select id="mDirection"><option value="customer">고객 기준으로 매물 찾기</option><option value="property">매물 기준으로 고객 찾기</option></select></label><label>기준 대상<select id="mTarget"></select></label><label>결과<select id="mResult"><option value="all">전체 후보</option><option value="fit">불일치 없는 후보</option></select></label></div><p class="muted">지역은 고객 희망지역과 각 필지의 행정동을 비교합니다. 면적은 ㎡ 기준, 매매가는 만원 기준입니다. 숫자나 단위가 불분명한 기존 메모는 '확인 필요'로 남깁니다.</p></div><div class="panel"><h2 id="mTitle">매칭 결과</h2><div id="mRows"></div></div>`;

async function flushCloudSave(){cloudBusy=true;while(cloudPending&&authToken&&cloudReady){cloudPending=false;const payload=JSON.stringify(db);if(payload===cloudLastSaved)continue;showSaveStatus('공동 서버에 저장 중...',false);try{const result=await cloudRPC('lm_cloud_write',{p_expected_version:cloudVersion,p_data:JSON.parse(payload)});if(!result||result.ok!==true){cloudPending=false;const latest=await cloudRPC('lm_cloud_read',{});db={...empty(),...latest.data};cloudVersion=latest.version;cloudLastSaved=JSON.stringify(db);render();showSaveStatus('동시 수정 충돌! 서버 최신 자료를 다시 불러왔습니다. 방금 입력한 내용은 다시 확인하세요.',true);break}cloudVersion=result.version;cloudLastSaved=payload;showSaveStatus('공동 서버 저장 완료 · 버전 '+cloudVersion,false)}catch(e){cloudPending=false;showSaveStatus('서버 저장 실패: '+e.message+' · 새로고침 전에 내용을 확인하세요.',true);console.error(e);break}}cloudBusy=false}
window.addEventListener('beforeunload',e=>{if(cloudBusy||cloudPending){e.preventDefault();e.returnValue='저장 중인 변경사항이 있습니다.'}});
let authToken=null,authRefreshToken=null,authExpiresAt=0,authRefreshPromise=null;
const AUTO_KEY='landmaker-auto-session-v1';
function persistAuthSession(){try{if(document.getElementById('autoLogin').checked&&authRefreshToken){localStorage.setItem(AUTO_KEY,JSON.stringify({refresh_token:authRefreshToken,expires_at:authExpiresAt}));}else localStorage.removeItem(AUTO_KEY)}catch(e){console.warn('자동로그인 저장 실패',e)}}
function clearAuthSession(){authRefreshToken=null;authExpiresAt=0;try{localStorage.removeItem(AUTO_KEY)}catch(_){}}
function setAuthSession(j){authToken=j.access_token;authRefreshToken=j.refresh_token||authRefreshToken;authExpiresAt=Date.now()+Math.max(60,Number(j.expires_in)||3600)*1000;persistAuthSession()}
async function refreshAuthSession(){if(authRefreshPromise)return authRefreshPromise;if(!authRefreshToken)throw Error('로그인 갱신 정보가 없습니다.');authRefreshPromise=(async()=>{const r=await fetchWithTimeout(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:authRefreshToken})});const j=await r.json();if(!r.ok||!j.access_token)throw Error(j.error_description||j.message||'로그인 상태가 만료됐습니다.');setAuthSession(j);return j.access_token})();try{return await authRefreshPromise}finally{authRefreshPromise=null}}
async function ensureFreshAuth(){if(authToken&&authRefreshToken&&Date.now()>authExpiresAt-120000){try{await refreshAuthSession()}catch(e){showSaveStatus('로그인이 만료됐습니다. 다시 로그인해 주세요.',true);throw e}}}

// 삭제할 때 현재 로그인 계정의 비밀번호를 Supabase Auth에 재확인합니다.
// 비밀번호는 저장하거나 로그에 출력하지 않습니다.
function askDeletePassword(title,description){return new Promise(resolve=>{
 const wrap=document.createElement('div');wrap.className='delete-confirm-overlay';
 wrap.innerHTML=`<div class="delete-confirm-box" role="dialog" aria-modal="true" aria-label="삭제 확인"><h2>${esc(title)}</h2><p style="white-space:pre-wrap">${esc(description)}</p><p><b>현재 로그인 계정 비밀번호</b>를 입력해야 삭제됩니다.</p><form><input type="password" autocomplete="current-password" required placeholder="비밀번호 입력" aria-label="현재 로그인 비밀번호"><p class="error" aria-live="polite"></p><div class="row"><button type="button" class="alt" data-cancel>취소</button><button type="submit" class="danger">비밀번호 확인 후 삭제</button></div></form></div>`;
 document.body.appendChild(wrap);const inp=wrap.querySelector('input'),form=wrap.querySelector('form'),err=wrap.querySelector('.error');
 const done=v=>{inp.value='';wrap.remove();resolve(v)};
 wrap.querySelector('[data-cancel]').onclick=()=>done(null);
 wrap.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();done(null)}});
 form.onsubmit=e=>{e.preventDefault();const password=inp.value;if(!password)return;form.querySelector('[type=submit]').disabled=true;err.textContent='비밀번호를 확인하고 있습니다...';void (async()=>{try{
  if(!authToken||!cloudReady)throw Error('로그인 또는 공동저장 연결이 필요합니다.');
  const headers={'apikey':SB_KEY,'Authorization':'Bearer '+authToken};
  const u=await fetchWithTimeout(SB_URL+'/auth/v1/user',{headers});if(!u.ok)throw Error('현재 로그인 확인에 실패했습니다. 다시 로그인해 주세요.');
  const current=await u.json();if(!current.id||!current.email)throw Error('현재 계정 이메일을 확인할 수 없습니다.');
  const r=await fetchWithTimeout(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:current.email,password})});
  const data=await r.json();if(!r.ok||!data.access_token||data.user?.id!==current.id)throw Error('비밀번호가 일치하지 않습니다.');
  done(true);
 }catch(ex){err.textContent=ex.message||'비밀번호 확인에 실패했습니다.';inp.value='';inp.focus();form.querySelector('[type=submit]').disabled=false}})()};
 inp.focus();
})}
async function protectedDelete(kind,key){const isCustomer=kind==='customer',list=isCustomer?'customers':'properties',item=get(list,key);if(!item)return;if(!confirm('오프라인 자료에서 삭제할까요? 삭제 전 JSON 백업을 권장합니다.'))return;db[list]=db[list].filter(x=>x.id!==key);if(isCustomer){db.records=db.records.filter(x=>x.customerId!==key);db.properties.forEach(x=>{if(x.customerId===key)x.customerId=''})}else{db.records.forEach(x=>{if(x.propertyId===key)x.propertyId=''});db.transactions=db.transactions.filter(x=>x.propertyId!==key);db.ownership=db.ownership.filter(x=>x.propertyId!==key)}editing=null;close();save()}

async function checkStaff(token){const headers={'apikey':SB_KEY,'Authorization':'Bearer '+token};const u=await fetchWithTimeout(SB_URL+'/auth/v1/user',{headers});if(!u.ok)throw Error('로그인 사용자 확인 실패 ('+u.status+')');const user=await u.json();if(!user?.id)throw Error('로그인 사용자 ID를 확인할 수 없습니다.');const r=await fetchWithTimeout(SB_URL+'/rest/v1/lm_staff?select=name,auth_user_id&auth_user_id=eq.'+encodeURIComponent(user.id)+'&limit=1',{headers});if(!r.ok)throw Error('직원 권한 확인 실패 ('+r.status+')');const a=await r.json();if(!Array.isArray(a)||a.length!==1||a[0].auth_user_id!==user.id)throw Error('현재 로그인 계정은 랜드메이커 직원으로 등록되어 있지 않습니다.');return a[0]}
function openAuth(){authToken=null;cloudReady=false;document.getElementById('authGate').hidden=false;document.getElementById('authInfo').hidden=true;document.getElementById('view').innerHTML='';document.getElementById('nav').innerHTML=''}
async function activateAuth(token){const staff=await checkStaff(token);authToken=token;document.getElementById('authStaffName').textContent=staff.name+' 님 (공동저장 시험판)';await loadCloud();document.getElementById('authGate').hidden=true;document.getElementById('authInfo').hidden=false;render()}
async function fetchWithTimeout(url,options={},ms=12000){const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),ms);try{return await fetch(url,{...options,signal:ctrl.signal})}finally{clearTimeout(t)}}
function authMessage(ex){if(ex?.name==='AbortError')return '서버 응답이 12초 동안 없습니다. 인터넷 연결 또는 브라우저 보안 설정을 확인하세요.';if(ex instanceof TypeError)return 'Supabase 서버 요청이 차단되거나 네트워크 연결에 실패했습니다. 브라우저 개발자도구(F12)의 Console/Network 오류를 확인해 주세요. (CORS, 확장 프로그램 또는 네트워크 차단 가능)';return ex?.message||'로그인 오류가 발생했습니다.'}
window.landmakerLoginClick=async()=>{const btn=document.getElementById('authSubmit'),err=document.getElementById('authError'),progress=document.getElementById('authProgress');if(btn.disabled)return;btn.disabled=true;btn.textContent='연결 중...';err.textContent='';progress.textContent='① Supabase 로그인 서버에 연결 중...';try{const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value;try{if(document.getElementById('rememberEmail').checked)localStorage.setItem('landmaker-remember-email',email);else localStorage.removeItem('landmaker-remember-email')}catch(_){}if(!email){throw Error('직원 이메일을 먼저 입력해 주세요.')}if(!password){throw Error('비밀번호를 먼저 입력해 주세요.')}const r=await fetchWithTimeout(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const j=await r.json();if(!r.ok||!j.access_token)throw Error(j.msg||j.error_description||j.message||'이메일·비밀번호 또는 이메일 인증 상태를 확인하세요. (HTTP '+r.status+')');progress.textContent='② 로그인 성공, 직원 권한 확인 중...';await activateAuth(j.access_token);setAuthSession(j);document.getElementById('authPassword').value='';progress.textContent='로그인 성공'}catch(ex){console.error('로그인 실패',ex);err.textContent=authMessage(ex);progress.textContent='로그인 실패 · 아래 오류 내용을 확인하세요.';openAuth()}finally{btn.disabled=false;btn.textContent='로그인'}};
document.getElementById('authLogout').onclick=async()=>{const t=authToken;if(cloudPoll)clearInterval(cloudPoll);clearAuthSession();openAuth();document.getElementById('authPassword').value='';if(t){try{await fetch(SB_URL+'/auth/v1/logout',{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+t}})}catch(e){console.warn('로그아웃 서버 요청 실패',e)}}};
// IndexedDB: offline-only local persistence. This is NOT multi-PC sync.
const OFFLINE_DB='landmaker-offline-v1';let offlineConn=null,offlineQueue=Promise.resolve();
function offlineOpen(){return new Promise((resolve,reject)=>{const r=indexedDB.open(OFFLINE_DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('data'))r.result.createObjectStore('data')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function offlineRead(){return new Promise((resolve,reject)=>{const t=offlineConn.transaction('data','readonly');const r=t.objectStore('data').get('snapshot');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function offlineWrite(payload){return new Promise((resolve,reject)=>{const t=offlineConn.transaction('data','readwrite');t.objectStore('data').put(payload,'snapshot');t.oncomplete=()=>resolve();t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error)})}
function offlineSave(){const snapshot=db;offlineQueue=offlineQueue.catch(()=>{}).then(()=>offlineWrite({data:snapshot,at:new Date().toISOString()})).then(()=>showSaveStatus('이 PC에 오프라인 저장 완료',false)).catch(e=>showSaveStatus('로컬 저장 실패: '+e.message,true));return offlineQueue}
window.addEventListener('error',e=>showSaveStatus('화면 오류: '+e.message,true));window.addEventListener('unhandledrejection',e=>showSaveStatus('처리 오류: '+String(e.reason),true));
(async()=>{try{if(!window.indexedDB)throw Error('이 브라우저는 IndexedDB를 지원하지 않습니다.');offlineConn=await offlineOpen();const saved=await offlineRead();if(saved?.data)db={...empty(),...saved.data};document.getElementById('authGate').hidden=true;document.getElementById('authInfo').hidden=false;document.getElementById('authStaffName').textContent='오프라인 독립 모드 · 직원별 동기화 없음';document.getElementById('authLogout').style.display='none';render();showSaveStatus('오프라인 자료 불러오기 완료',false)}catch(e){document.getElementById('authProgress').textContent='오프라인 저장소를 열 수 없습니다: '+e.message;document.getElementById('authError').textContent='Whale/Chrome에서 이 HTML을 직접 열어 주세요. 이 모드에서는 서버 로그인하지 않습니다.';document.getElementById('authSubmit').disabled=true}})();
</script></body></html>
