// 통합 인물코드: 동일인 자동 병합 금지, 직원이 기존 코드를 선택한 경우에만 연결.
function peopleIndex(){const m=new Map();const add=(x,kind,where)=>{if(!x||!x.personCode)return;const code=x.personCode;let a=m.get(code);if(!a){a={code,names:new Set(),phones:new Set(),births:new Set(),addresses:new Set(),places:new Set(),kinds:new Set()};m.set(code,a)}if(x.name)a.names.add(x.name.trim());if(x.phone)a.phones.add(x.phone.replace(/\D/g,''));if(x.birth)a.births.add(x.birth.replace(/\D/g,''));if(x.address)a.addresses.add(x.address.replace(/\s/g,''));if(where)a.places.add(where);a.kinds.add(kind)};db.customers.forEach(c=>add(c,'고객',''));db.properties.forEach(p=>{const place=(p.parcels||[]).map(formatLot).filter(Boolean).join(', ');[...(p.landOwners||[]),...(p.buildingOwners||[])].forEach(o=>add(o,'소유주',place))});return [...m.values()]}
function newPersonCode(){const used=new Set(peopleIndex().map(x=>x.code));let n=1;while(used.has('P-'+String(n).padStart(6,'0')))n++;return 'P-'+String(n).padStart(6,'0')}
function candidatePeople(name,phone,birth,address,exclude=''){const n=(name||'').trim(),ph=(phone||'').replace(/\D/g,''),b=(birth||'').replace(/\D/g,''),a=(address||'').replace(/\s/g,'');return peopleIndex().filter(x=>x.code!==exclude&&n&&x.names.has(n)).map(x=>{const reasons=[];if(ph.length>=8&&x.phones.has(ph))reasons.push('연락처 일치');if(b.length>=8&&x.births.has(b))reasons.push('생년월일 일치');if(a.length>=6&&x.addresses.has(a))reasons.push('소유주 주소 일치');return {...x,reasons}}).filter(x=>x.reasons.length).sort((a,b)=>b.reasons.length-a.reasons.length)}
function personCandidateHtml(code,name,phone,birth,address){const candidates=candidatePeople(name,phone,birth,address,code);return candidates.length?'<div class="muted">동일인 후보 (자동 연결되지 않음): '+candidates.map(x=>esc(x.code)+' · '+esc(x.reasons.join('/'))+' · 연결 필지 '+esc([...x.places].join('; ')||'없음')).join(' | ')+'</div>':'<div class="muted">확인 가능한 동일인 후보 없음. 이름만 같으면 자동 연결하지 않습니다.</div>'}
function personOptions(current=''){return '<option value="">새 인물코드 발급 (저장 시)</option>'+(current?`<option value="${esc(current)}" selected>${esc(current)} · 현재 연결 코드</option>`:'')}
function bindPersonLookup(root){root.querySelectorAll('select[name="personCode"],select[name="ownerPersonCodeItem"]').forEach(sel=>{const wrap=document.createElement('div');wrap.style.cssText='margin:6px 0 10px';wrap.innerHTML='<div class="row"><input type="search" placeholder="기존 인물 이름·전화번호·코드 검색" style="min-width:210px"><button type="button" class="alt">기존 코드 찾기</button></div><div class="muted" data-person-results>기존 인물코드를 검색한 후 선택하세요. 이름만 같으면 연결하지 마세요.</div>';sel.parentElement.appendChild(wrap);const input=wrap.querySelector('input'),btn=wrap.querySelector('button'),result=wrap.querySelector('[data-person-results]');const find=()=>{const q=input.value.trim().toLowerCase();if(q.length<2){result.textContent='두 글자 이상 입력해 주세요.';return}const found=peopleIndex().filter(x=>[x.code,...x.names,...x.phones].some(v=>String(v).toLowerCase().includes(q))).slice(0,30);result.innerHTML=found.length?found.map(x=>`<p><button type="button" class="alt" data-person-code="${esc(x.code)}">${esc(x.code)} · ${esc([...x.names].join('/'))} · ${esc([...x.phones].join('/'))}</button></p>`).join(''):'일치하는 기존 코드가 없습니다.';result.querySelectorAll('[data-person-code]').forEach(b=>b.onclick=()=>{const code=b.dataset.personCode;if(![...sel.options].some(o=>o.value===code))sel.add(new Option(code+' · 선택한 기존 코드',code));sel.value=code;result.textContent=code+' 연결 선택됨 (저장 시 적용)'});};btn.onclick=find;input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();find()}}})}

function cleanRichHtml(raw){
 const template=document.createElement('template');template.innerHTML=String(raw||'');
 const allowed=new Set(['B','STRONG','I','EM','U','S','STRIKE','P','DIV','BR','UL','OL','LI','SPAN','FONT','H3','H4']);
 function visit(parent){for(const node of [...parent.childNodes]){if(node.nodeType===8){node.remove();continue}if(node.nodeType!==1)continue;const tag=node.tagName;if(!allowed.has(tag)){const txt=document.createTextNode(node.textContent||'');node.replaceWith(txt);continue}const color=(node.getAttribute('color')||node.style.color||'').trim();for(const a of [...node.attributes])node.removeAttribute(a.name);if((tag==='FONT'||tag==='SPAN')&&(/^#[0-9a-fA-F]{6}$/.test(color)||/^rgb\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}\s*\)$/.test(color)))node.style.color=color;visit(node)}}visit(template.content);return template.innerHTML;
}
function richToPlainText(raw){const el=document.createElement('div');el.innerHTML=cleanRichHtml(raw||'');return el.innerText||el.textContent||''}
function richField(name,content,placeholder){const safe=cleanRichHtml(content);return `<div class="rich-wrap" data-rich="${name}"><div class="rich-toolbar"><label class="rich-color-label" title="선택한 글씨 색상 변경">글씨색 <select data-rich-cmd="foreColor" aria-label="글씨 색상"><option value="#111827">⚫ 검정</option><option value="#dc2626">🔴 빨강</option><option value="#ea580c">🟠 주황</option><option value="#ca8a04">🟡 노랑</option><option value="#15803d">🟢 초록</option><option value="#2563eb">🔵 파랑</option><option value="#7c3aed">🟣 보라</option><option value="#64748b">⚪ 회색</option></select></label><button type="button" data-rich-cmd="bold"><b>굵게</b></button><button type="button" data-rich-cmd="italic"><i>기울임</i></button><button type="button" data-rich-cmd="underline"><u>밑줄</u></button><button type="button" data-rich-cmd="insertUnorderedList">• 목록</button><button type="button" data-rich-cmd="insertOrderedList">1. 목록</button><button type="button" data-rich-cmd="removeFormat">서식 지우기</button></div><div class="rich-editor" contenteditable="true" data-placeholder="${esc(placeholder)}">${safe}</div><textarea class="rich-source" name="${name}"></textarea></div>`}
function bindRichFields(root){root.querySelectorAll('.rich-wrap').forEach(w=>{const editor=w.querySelector('.rich-editor'),source=w.querySelector('.rich-source');let savedRange=null;const remember=()=>{const sel=window.getSelection();if(sel&&sel.rangeCount&&editor.contains(sel.anchorNode))savedRange=sel.getRangeAt(0).cloneRange()};const sync=()=>{source.value=editor.innerText||'';remember()};editor.addEventListener('mouseup',remember);editor.addEventListener('keyup',remember);editor.addEventListener('input',sync);editor.addEventListener('paste',e=>{e.preventDefault();const text=e.clipboardData.getData('text/plain');document.execCommand('insertText',false,text)});w.querySelectorAll('[data-rich-cmd]').forEach(control=>{if(control.tagName==='BUTTON')control.addEventListener('mousedown',e=>e.preventDefault());const act=()=>{editor.focus();if(savedRange){const sel=window.getSelection();sel.removeAllRanges();sel.addRange(savedRange)}document.execCommand(control.dataset.richCmd,false,control.value||null);sync()};control.addEventListener(control.tagName==='SELECT'?'change':'click',act)});sync()})}

 const q=($('#cSearch')?.value||'').trim().toLowerCase(),staff=[...document.querySelectorAll('[name=staffFilter]:checked')].map(x=>x.value),cat=$('#cCat')?.value||'';

const PY=3.305785;
const pyeongOf=v=>v===''||v==null?'':(Number(v)/PY).toFixed(2);
const sqmOf=v=>v===''||v==null?'':(Number(v)*PY).toFixed(2);
function areaPair(prefix,label,sqm='',extra=''){
 const shortLabel=label.replace('희망 ','').replace(' 최소',' 최소').replace(' 최대',' 최대');
 return `<div class="area-pair compact-area"><label>${shortLabel} (평)<input data-area-py="${prefix}" type="number" min="0" step="any" placeholder="평 입력" value="${esc(pyeongOf(sqm))}"></label><input data-area-sqm="${prefix}" name="${prefix}" type="hidden" value="${esc(sqm)}"><span class="area-converted" data-area-display="${prefix}">${sqm!==''&&sqm!=null?esc(Number(sqm).toLocaleString('ko-KR',{maximumFractionDigits:2}))+' ㎡':'㎡ 자동환산'}</span>${extra}</div>`;
}
function bindAreaPairs(root){
 root.querySelectorAll('[data-area-py]').forEach(py=>{
  const key=py.dataset.areaPy,sqm=root.querySelector(`[data-area-sqm="${key}"]`),display=root.querySelector(`[data-area-display="${key}"]`);
  if(!sqm)return;
  const sync=()=>{sqm.value=sqmOf(py.value);if(display)display.textContent=py.value===''?'㎡ 자동환산':Number(sqm.value).toLocaleString('ko-KR',{maximumFractionDigits:2})+' ㎡';sqm.dispatchEvent(new Event('change',{bubbles:true}))};
  py.addEventListener('input',sync);
 });
}
function parcelRow(p={}){return `<div class="parcelrow" draggable="false"><div class="parcel-sortbar"><span class="parcel-drag" draggable="true" title="잡고 드래그하여 순서 변경" aria-label="필지 순서 변경">☰ 순서 이동</span><span class="parcel-rank"></span><div class="parcel-sortbuttons"><button type="button" class="alt parcelUp" title="위로 이동">↑</button><button type="button" class="alt parcelDown" title="아래로 이동">↓</button></div></div><label>행정동<input name="dong" placeholder="예: 과림동" value="${esc(p.dong)}" required></label><label>산 여부<span class="parcel-check"><input type="checkbox" name="san" ${p.san?'checked':''}> 산</span></label><label>본번<input name="main" placeholder="본번" value="${esc(p.main)}" required></label><label>부번<input name="sub" placeholder="부번" value="${esc(p.sub)}"></label><label>지목<input name="landUse" placeholder="지목" value="${esc(p.landUse)}"></label><label>면적 (평)<input data-parcel-py type="number" min="0" step="any" placeholder="평" value="${esc(pyeongOf(p.sqm))}"></label><label>면적 (㎡)<input name="sqm" type="number" min="0" step="any" placeholder="㎡" value="${esc(p.sqm)}"></label><div class="parcel-actions"><button type="button" class="alt removeParcel pillbutton">필지 삭제</button></div></div>`}
function floorRow(x={}){return `<div class="lm-floor-row"><label>층 구분<input name="levelName" placeholder="예: 1층, 2층, 지하 1층" value="${esc(x.levelName||'')}"></label><label>해당 층 용도<input name="levelUse" placeholder="예: 공장, 사무실" value="${esc(x.levelUse||'')}"></label><label>면적 (평)<input data-level-py type="number" min="0" step="any" value="${esc(pyeongOf(x.sqm))}"></label><label>면적 (㎡)<input name="levelSqm" type="number" min="0" step="any" value="${esc(x.sqm||'')}"></label><button type="button" class="alt removeFloor">삭제</button></div>`}
function buildingRow(b={}){return `<div class="buildingrow"><div class="building-grid"><label>건물동 / 명칭<input name="buildingName" value="${esc(b.buildingName)}" placeholder="A동, 주건물 등"></label><label>건물 용도<input name="buildingUse" value="${esc(b.buildingUse)}" placeholder="제조업소, 창고시설 등"></label><label>건축면적 (평)<input data-building-py="footprint" type="number" min="0" step="any" value="${esc(pyeongOf(b.footprintSqm))}"></label><label>건축면적 (㎡)<input name="footprintSqm" type="number" min="0" step="any" value="${esc(b.footprintSqm)}"></label><label>사용승인일<input name="approvalDate" placeholder="YYYY-MM-DD" value="${esc(b.approvalDate)}"></label></div><div class="lm-floor-section"><b>이 건물동의 층별 정보</b><p class="muted">1층·2층·지하층을 각각 추가하세요. 층별 면적을 합산해 연면적을 계산합니다.</p><div class="lm-floor-rows">${(Array.isArray(b.levels)&&b.levels.length?b.levels:[{}]).map(floorRow).join('')}</div><button type="button" class="alt addFloor">+ 층 추가</button><div class="lm-building-floor-total">층별 연면적 합계: <strong>0.00평 (0㎡)</strong></div><div class="lm-legacy-floor" ${Array.isArray(b.levels)&&b.levels.length?'hidden':''}><label>기존 연면적 (㎡) · 층별 면적을 입력하면 자동으로 대체됩니다<input name="legacyFloorSqm" type="number" min="0" step="any" value="${esc(b.floorSqm)}"></label></div></div><div class="building-actions"><button type="button" class="alt removeBuilding">건물동 삭제</button></div></div>`}
function parseBuildings(f){return [...f.querySelectorAll('.buildingrow')].map(r=>{const get=n=>r.querySelector('[name="'+n+'"]')?.value.trim()||'';const levels=[...r.querySelectorAll('.lm-floor-row')].map(z=>({levelName:z.querySelector('[name=levelName]').value.trim(),levelUse:z.querySelector('[name=levelUse]').value.trim(),sqm:z.querySelector('[name=levelSqm]').value.trim()})).filter(z=>z.levelName||z.levelUse||z.sqm);const floorSqm=levels.length?String(levels.reduce((n,z)=>n+(Number(z.sqm)||0),0)):get('legacyFloorSqm');return {buildingName:get('buildingName'),buildingUse:get('buildingUse'),structure:'',floors:levels.map(z=>z.levelName).filter(Boolean).join(', '),footprintSqm:get('footprintSqm'),floorSqm,approvalDate:get('approvalDate'),levels}}).filter(b=>b.buildingName||b.buildingUse||b.footprintSqm||b.floorSqm||b.approvalDate||b.levels.length)}
function bindBuildings(){const f=$('#propertyForm');if(!f)return;const area=$('#buildingFields');function totals(){for(const r of area.querySelectorAll('.buildingrow')){const levels=[...r.querySelectorAll('.lm-floor-row')].filter(z=>z.querySelector('[name=levelName]').value.trim()||z.querySelector('[name=levelUse]').value.trim()||z.querySelector('[name=levelSqm]').value.trim());const sqm=levels.length?levels.reduce((n,z)=>n+(Number(z.querySelector('[name=levelSqm]').value)||0),0):Number(r.querySelector('[name=legacyFloorSqm]').value)||0;r.querySelector('.lm-building-floor-total strong').textContent=(sqm/PY).toFixed(2)+'평 ('+sqm.toLocaleString('ko-KR',{maximumFractionDigits:2})+'㎡)';r.querySelector('.lm-legacy-floor').hidden=levels.length>0}const list=parseBuildings(f),floor=list.reduce((n,b)=>n+(Number(b.floorSqm)||0),0),foot=list.reduce((n,b)=>n+(Number(b.footprintSqm)||0),0);$('#buildingTotal').innerHTML=`<div class="area-metric"><span>전체 건축면적 합계</span><b>${(foot/PY).toFixed(2)}평</b> <small>(${foot.toLocaleString('ko-KR',{maximumFractionDigits:2})}㎡)</small></div><div class="area-metric"><span>전체 연면적 합계 · ${list.length}개 동</span><b>${(floor/PY).toFixed(2)}평</b> <small>(${floor.toLocaleString('ko-KR',{maximumFractionDigits:2})}㎡)</small></div>`}area.addEventListener('input',e=>{const r=e.target.closest('.buildingrow');if(!r)return;const x=e.target;if(x.dataset.levelPy!==undefined){x.closest('.lm-floor-row').querySelector('[name=levelSqm]').value=sqmOf(x.value)}else if(x.name==='levelSqm'){x.closest('.lm-floor-row').querySelector('[data-level-py]').value=pyeongOf(x.value)}else if(x.dataset.buildingPy==='footprint'){r.querySelector('[name=footprintSqm]').value=sqmOf(x.value)}else if(x.name==='footprintSqm'){r.querySelector('[data-building-py=footprint]').value=pyeongOf(x.value)}totals()});area.addEventListener('click',e=>{const t=e.target;if(t.classList.contains('addFloor')){t.closest('.buildingrow').querySelector('.lm-floor-rows').insertAdjacentHTML('beforeend',floorRow());totals()}else if(t.classList.contains('removeFloor')){t.closest('.lm-floor-row').remove();totals()}else if(t.classList.contains('removeBuilding')){if(area.children.length===1){alert('건물이 없는 토지 매물은 건물정보를 빈칸으로 두세요.');return}t.closest('.buildingrow').remove();totals()}});$('#addBuilding').onclick=()=>{area.insertAdjacentHTML('beforeend',buildingRow());totals()};totals()}

function ownerRow(o={},kind='land'){return `<div class="ownerrow" data-kind="${kind}" style="border:1px solid #cbd8df;border-radius:9px;padding:12px;margin:9px 0"><div class="grid"><label>소유주명<input name="ownerNameItem" value="${esc(o.name)}"></label><label>통합 인물코드<select name="ownerPersonCodeItem">${personOptions(o.personCode)}</select></label><label>생년월일<input name="ownerBirthItem" placeholder="YYYY-MM-DD" value="${esc(o.birth)}"></label><label>주소<input name="ownerAddressItem" value="${esc(o.address)}"></label><label>연락처<input name="ownerPhoneItem" value="${esc(o.phone)}"></label><label>지분<input name="ownerShareItem" placeholder="예: 1/2, 50%" value="${esc(o.share)}"></label></div><div data-person-candidates class="area-summary"></div><button type="button" class="alt removeOwner" style="margin-top:8px">이 소유주 삭제</button></div>`}

function propertyForm(p={}){return `<form id="propertyForm"><input type="hidden" name="id" value="${esc(p.id)}"><h3>기본정보 · 거래조건</h3><div class="grid"><label>매물명 (선택)<input name="title" value="${esc(p.title)}" placeholder="대표 지번으로 자동 생성"></label><label>거래유형<select name="type">${['매매','임대','매매·임대'].map(x=>`<option ${p.type===x?'selected':''}>${x}</option>`).join('')}</select></label><label>연결 고객 / 소유주<select name="customerId">${opts('customers',p.customerId)}</select></label><label>보증금 (만원)<input name="deposit" type="number" min="0" step="any" value="${esc(p.deposit)}"></label><label>월세 (만원)<input name="rent" type="number" min="0" step="any" value="${esc(p.rent)}"></label><label>매매가 (만원)<input name="salePrice" type="number" min="0" step="any" value="${esc(p.salePrice)}"><small class="muted">저장할 때 이전 금액과 달라지면 변동이력이 자동 기록됩니다.</small></label><label>토지 평당가 (만원/평)<input name="land_price_per_pyeong" type="number" min="0" step="any" value="${esc(p.land_price_per_pyeong)}" placeholder="매매가와 토지면적 입력 시 자동계산"><small class="muted">자동 계산 · 이 칸에서 직접 수정 가능</small></label><label>대표 담당직원 (미지정 가능)<select name="staff"><option value="">담당자 미지정</option>${STAFF.map(x=>`<option value="${x}" ${p.staff===x?'selected':''}>${x}</option>`).join('')}</select></label><label>매매진행 상태<select name="saleStatus">${['','진행중','완료','보류'].map(x=>`<option value="${x}" ${p.saleStatus===x?'selected':''}>${x||'진행 안 함'}</option>`).join('')}</select></label><label>임대진행 상태<select name="leaseStatus">${['','진행중','완료','보류'].map(x=>`<option value="${x}" ${p.leaseStatus===x?'selected':''}>${x||'진행 안 함'}</option>`).join('')}</select></label><label>정보 확인일<input name="confirmedDate" type="date" value="${esc(p.confirmedDate)}"></label></div><h3>공동담당자</h3><div class="checks">${STAFF.map(x=>`<label><input name="coStaff" type="checkbox" value="${x}" ${(p.coStaff||[]).includes(x)?'checked':''}>${x}</label>`).join('')}</div><h3>① 매물 핵심정보 · 면적 합계</h3><div class="lm-top-summaries"><div><strong>전체 토지면적</strong><div id="parcelTotal" class="area-summary" role="status" aria-live="polite"></div></div><div><strong>전체 건물면적 · 연면적</strong><div id="buildingTotal" class="area-summary" role="status" aria-live="polite"></div></div></div><p class="muted">위 면적은 아래 상세 필지·건물 정보를 입력하면 자동으로 계산됩니다. 매매가·임대료는 위 거래조건에서 확인할 수 있습니다.</p><h3>② 금액 변경이력</h3><p class="muted">매매가·보증금·월세를 수정해 저장하면 변경 전후 금액과 날짜가 기록됩니다. 기존 기록은 유지됩니다.</p><div class="lm-price-change-meta"><label>금액 변경일 <input name="priceChangeDate" type="date" value="${today()}"></label><label>이번 변경 사유 <input name="priceChangeNote" placeholder="예: 소유주 요청으로 인하"></label><input type="hidden" name="price" value="${esc(p.price)}"></div><div class="lm-manual-history"><div id="manualPriceRows">${(p.manualPriceHistory||[]).map(manualPriceRow).join('')}</div><button type="button" class="alt" id="addManualPrice">+ 금액 변경이력 추가</button><p class="muted">과거 금액 변경도 한 건씩 직접 입력할 수 있습니다. 입력한 내역은 저장 후 날짜순으로 표시됩니다.</p></div><div class="lm-price-history" aria-label="날짜별 금액 변경이력">${propertyPriceHistoryRows(p)}</div><h3>③ 설비 · 기타정보 · 상세내용</h3><div class="grid"><label>호이스트<input name="hoist" placeholder="유무 및 용량" value="${esc(p.hoist)}"></label><label>전기 (kW)<input name="electricity" value="${esc(p.electricity)}"></label><label>정화조<input name="septic" value="${esc(p.septic)}"></label><label>진입차량<input name="vehicle" value="${esc(p.vehicle)}"></label><label>입주가능일<input name="availableDate" value="${esc(p.availableDate)}"></label></div><label>관리비 (만원)<input name="maintenance" value="${esc(p.maintenance)}" placeholder="월 관리비"></label><div class="lm-rich-field"><div class="lm-rich-heading">매물 상세내용</div>${richField("note",p.noteRich||esc(p.note||""),"매물 상세내용을 입력하세요.")}</div><h3>④ 토지정보 · 필지별 입력</h3><p class="muted">각 필지마다 행정동을 별도로 입력합니다. 첫 번째 필지가 대표필지입니다. 다른 행정동 필지를 추가해도 해당 행정동 검색에 함께 나타납니다.</p><div id="parcelFields">${(p.parcels?.length?p.parcels:[{}]).map(parcelRow).join('')}</div><button type="button" class="alt" id="addParcel">+ 필지 추가</button><h3>⑤ 건물정보 · 건물동별 입력</h3><p class="muted">토지와 건물은 같은 매물에서 관리합니다. 건물이 없으면 아래 입력칸을 비워 두세요.</p><div id="buildingFields">${(p.buildings?.length?p.buildings:[p.buildingSqm?{floorSqm:p.buildingSqm}:{}]).map(buildingRow).join('')}</div><button type="button" class="alt" id="addBuilding">+ 건물동 추가</button><h3>⑥ 토지 소유주 · 지분</h3><p class="muted">여러 소유주를 등록할 수 있습니다. 지분은 등기부 기준으로 입력하세요.</p><div id="landOwnerFields">${(p.landOwners?.length?p.landOwners:[p.ownerName?{name:p.ownerName,birth:p.ownerBirth,address:p.ownerAddress,phone:p.ownerPhone}:{}]).map(o=>ownerRow(o,'land')).join('')}</div><button type="button" class="alt" id="addLandOwner">+ 토지 소유주 추가</button><h3>⑦ 건물 소유주 · 지분</h3><div id="buildingOwnerFields">${(p.buildingOwners?.length?p.buildingOwners:[{}]).map(o=>ownerRow(o,'building')).join('')}</div><button type="button" class="alt" id="addBuildingOwner">+ 건물 소유주 추가</button><div class="row"><button type="submit">전체매물에 저장</button><button type="button" class="alt" id="newProperty">새로 입력</button></div></form>`}
function parseParcels(form){return [...form.querySelectorAll('.parcelrow')].map(r=>({dong:r.querySelector('[name=dong]').value.trim(),san:r.querySelector('[name=san]').checked,main:r.querySelector('[name=main]').value.trim(),sub:r.querySelector('[name=sub]').value.trim(),landUse:r.querySelector('[name=landUse]').value.trim(),sqm:r.querySelector('[name=sqm]').value.trim()})).filter(p=>p.dong||p.main)}function bindParcels(){const f=$('#propertyForm');

 function updateRanks(){[...list.querySelectorAll('.parcelrow')].forEach((r,i)=>{r.querySelector('.parcel-rank').textContent=i===0?'대표필지 · 1번':(i+1)+'번 필지';r.classList.toggle('representative',i===0);r.querySelector('.parcelUp').disabled=i===0;r.querySelector('.parcelDown').disabled=i===list.querySelectorAll('.parcelrow').length-1})}
 list.addEventListener('dragstart',e=>{const handle=e.target.closest('.parcel-drag');if(!handle)return;dragged=handle.closest('.parcelrow');dragged.classList.add('parcel-moving');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','parcel-order')});

 list.addEventListener('drop',e=>{if(!dragged)return;e.preventDefault();dragged.classList.remove('parcel-moving');dragged=null;updateRanks();total()});
 list.addEventListener('dragend',()=>{if(dragged)dragged.classList.remove('parcel-moving');dragged=null;updateRanks();total()});
 list.addEventListener('click',e=>{const up=e.target.closest('.parcelUp'),down=e.target.closest('.parcelDown');if(!up&&!down)return;const r=e.target.closest('.parcelrow');if(up&&r.previousElementSibling)list.insertBefore(r,r.previousElementSibling);if(down&&r.nextElementSibling)list.insertBefore(r.nextElementSibling,r);updateRanks();total()});

 const py=r.querySelector('[data-parcel-py]'),sqm=r.querySelector('[name=sqm]');

async function extractFileText(file){

  const doc=await pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;

   const page=await doc.getPage(n),content=await page.getTextContent();

async function ocrExtract(input){

function backupView(){$('#view').innerHTML=`<div class="panel"><h2>백업 · 복원</h2><p>이 PC의 브라우저에 저장된 자료를 JSON 파일로 내보냅니다. 브라우저 데이터 삭제·PC 고장 시 자료가 사라질 수 있으니 외장 저장장치에도 복사하세요. 백업 파일에는 고객 개인정보가 포함되므로 안전하게 보관하세요.</p><div class="row"><button id="export">JSON 백업 다운로드</button><label>JSON 백업 복원<input type="file" id="import" accept=".json"></label></div><p class="muted">위 복원은 이 PC의 오프라인 자료만 교체하며 서버에는 영향을 주지 않습니다.</p></div><div class="panel"><h2>네이버 캘린더 가져오기 (ICS)</h2><p class="muted">기존 서버 일정은 유지합니다. 네이버 UID로 중복을 검사하며, 가져오기 전에 서버 최신 자료를 다시 읽습니다. 반복 일정은 원본 규칙을 보관하되 자동으로 모든 반복 날짜를 생성하지는 않습니다.</p><label>네이버 캘린더 .ics 파일 선택<input id="naverIcsFile" type="file" accept=".ics,text/calendar"></label><div class="row"><button type="button" id="naverIcsPreview">파일 분석 · 중복 확인</button><button type="button" id="naverIcsImport" disabled>서버에 일정 추가</button></div><p id="naverIcsStatus" class="muted" aria-live="polite">파일을 선택한 뒤 분석해 주세요.</p></div><div class="panel"><h2>Supabase 공동 서버 백업</h2><p>로그인한 직원 권한으로 서버의 최신 자료를 새로 조회하여 JSON 파일로 다운로드합니다. PC 로컬 백업과 별개입니다.</p><button id="exportCloud" type="button">공동 서버 전체 JSON 백업</button><p id="cloudBackupStatus" class="muted">서버 복원은 안전 검증 후 별도로 제공합니다. 현재는 백업만 가능합니다.</p></div>`;setupNaverCalendarImport();$('#exportCloud').onclick=async()=>{const btn=$('#exportCloud'),status=$('#cloudBackupStatus');if(!cloudReady||!authToken){status.textContent='직원 로그인과 공동 서버 연결이 먼저 필요합니다.';return}btn.disabled=true;status.textContent='서버에서 최신 자료 조회 중...';try{const latest=await cloudRPC('lm_cloud_read',{});if(!latest||!latest.data||typeof latest.version!=='number')throw Error('서버 백업 응답 형식이 올바르지 않습니다.');const data=latest.data;for(const key of ['customers','properties','records','schedules','transactions','ownership'])if(!Array.isArray(data[key]))throw Error('서버 데이터에 '+key+' 배열이 없습니다.');const payload={format:'landmaker-cloud-backup',backupFormatVersion:1,serverVersion:latest.version,exportedAt:new Date().toISOString(),data};const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='landmaker-cloud-backup-'+new Date().toISOString().slice(0,10)+'-v'+latest.version+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000);status.textContent='서버 버전 '+latest.version+' 백업 다운로드 요청 완료. 다운로드 폴더에서 파일 생성 여부와 크기를 확인하세요. 개인정보가 있으므로 안전하게 보관하세요.'}catch(e){status.textContent='서버 백업 실패: '+e.message}finally{btn.disabled=false}};$('#export').onclick=()=>{const blob=new Blob([JSON.stringify({version:6,data:db,at:new Date().toISOString()},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='landmaker-v06-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('#import').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(j.version!==6||!j.data||!['customers','properties','records','schedules','transactions','ownership'].every(k=>Array.isArray(j.data[k])))throw Error('지원하지 않는 백업 형식');if(confirm('이 PC의 오프라인 데이터를 백업 내용으로 교체할까요? 기존 백업 파일을 반드시 보관하세요.')){const incoming={...empty(),...j.data};const counts='고객 '+incoming.customers.length.toLocaleString()+'건 / 매물 '+incoming.properties.length.toLocaleString()+'건';const previous=db;const btn=document.getElementById('import');btn.disabled=true;showSaveStatus('대용량 데이터 저장 중... 화면을 닫지 마세요. '+counts,false);try{await offlineWrite({data:incoming,at:new Date().toISOString()});db=incoming;showSaveStatus('저장 완료 · '+counts,false);alert('저장 완료: '+counts+'\n이제 매물목록·고객목록을 확인하세요.');render()}catch(saveError){db=previous;showSaveStatus('복원 실패: '+saveError.message,true);alert('복원 실패: '+saveError.message+'\n기존 데이터는 그대로 유지됩니다.')}finally{btn.disabled=false}}}catch(err){alert(err.message)}}}

// 네이버 ICS 안전 가져오기: 기존 JSON을 덮어쓰지 않고 최신 서버 버전에 CAS 추가.
let naverPrepared=null;
function unfoldIcs(raw){return raw.replace(/\r\n/g,'\n').replace(/\r/g,'\n').replace(/\n[ \t]/g,'').split('\n')}
function decodeIcs(v){return String(v||'').replace(/\\n/gi,'\n').replace(/\\,/g,',').replace(/\\;/g,';').replace(/\\\\/g,'\\')}
function icsDate(v){if(!v)return null;const m=String(v).match(/^(\d{4})(\d\d)(\d\d)(?:T(\d\d)(\d\d)(\d\d)?(Z)?)?/);if(!m)return null;return {date:`${m[1]}-${m[2]}-${m[3]}`,time:m[4]?`${m[4]}:${m[5]}`:'',allDay:!m[4],utc:!!m[7],raw:v}}
function parseNaverIcs(raw){const rows=[];let current=null;for(const line of unfoldIcs(raw)){if(line==='BEGIN:VEVENT'){current={};continue}if(line==='END:VEVENT'){if(current)rows.push(current);current=null;continue}if(!current)continue;const at=line.indexOf(':');if(at<0)continue;const key=line.slice(0,at).split(';')[0].toUpperCase(),val=line.slice(at+1);if(['UID','DTSTART','DTEND','SUMMARY','DESCRIPTION','LOCATION','RRULE','RECURRENCE-ID','STATUS','LAST-MODIFIED'].includes(key))current[key]=val}return rows}
function makeNaverSchedule(e){const start=icsDate(e.DTSTART),end=icsDate(e.DTEND);if(!start||!e.UID)return null;let content=decodeIcs(e.SUMMARY)||'(제목 없음)';const description=decodeIcs(e.DESCRIPTION),place=decodeIcs(e.LOCATION);if(description)content+='\n'+description;const uid=e.UID+(e['RECURRENCE-ID']?'|'+e['RECURRENCE-ID']:'');return {id:id(),date:start.date,time:start.time,endTime:end?.time||'',allDay:start.allDay,content,place,staff:'',done:false,color:'#d6eceb',source:'naver-ics',sourceUid:uid,sourceLastModified:e['LAST-MODIFIED']||'',sourceStartRaw:e.DTSTART,sourceEndRaw:e.DTEND||'',sourceRrule:e.RRULE||'',sourceStatus:e.STATUS||''}}
function setupNaverCalendarImport(){const fileEl=document.getElementById('naverIcsFile'),preview=document.getElementById('naverIcsPreview'),importBtn=document.getElementById('naverIcsImport'),status=document.getElementById('naverIcsStatus');if(!fileEl)return;fileEl.onchange=()=>{naverPrepared=null;importBtn.disabled=true;status.textContent='파일을 분석해 주세요.'};preview.onclick=async()=>{importBtn.disabled=true;naverPrepared=null;try{if(!cloudReady||!authToken)throw Error('직원 로그인 후 이용해 주세요.');const f=fileEl.files?.[0];if(!f)throw Error('ICS 파일을 선택해 주세요.');if(f.size>15*1024*1024)throw Error('파일 크기가 15MB를 초과합니다.');status.textContent='파일 분석 및 서버 중복 검사 중...';const raw=await f.text();if(!raw.includes('BEGIN:VCALENDAR'))throw Error('올바른 ICS 파일이 아닙니다.');const events=parseNaverIcs(raw),seen=new Set(),unique=[],invalid=[];for(const e of events){const item=makeNaverSchedule(e);if(!item){invalid.push(e);continue}if(seen.has(item.sourceUid))continue;seen.add(item.sourceUid);unique.push(item)}const latest=await cloudRPC('lm_cloud_read',{});if(!latest||!Array.isArray(latest.data?.schedules))throw Error('서버 일정 조회에 실패했습니다.');const existing=new Set(latest.data.schedules.map(x=>x.sourceUid).filter(Boolean));const pending=unique.filter(x=>!existing.has(x.sourceUid));naverPrepared={items:unique,sourceCount:events.length};const recurring=unique.filter(x=>x.sourceRrule).length;status.textContent=`원본 ${events.length.toLocaleString()}건 / 고유 일정 ${unique.length.toLocaleString()}건 / 서버 UID 중복 ${unique.length-pending.length}건 / 새로 추가할 일정 ${pending.length.toLocaleString()}건 / 날짜 또는 UID 오류 ${invalid.length}건 / 반복 규칙 ${recurring}건. 확인 후 서버 추가를 눌러 주세요.`;importBtn.disabled=pending.length===0}catch(e){status.textContent='분석 실패: '+e.message}};
importBtn.onclick=async()=>{if(!naverPrepared)return;importBtn.disabled=true;preview.disabled=true;try{if(cloudBusy||cloudPending)throw Error('다른 일정 저장이 진행 중입니다. 완료 후 다시 시도하세요.');const latest=await cloudRPC('lm_cloud_read',{});if(!latest||typeof latest.version!=='number'||!Array.isArray(latest.data?.schedules))throw Error('서버 최신 일정 조회 실패');const existing=new Set(latest.data.schedules.map(x=>x.sourceUid).filter(Boolean));const additions=naverPrepared.items.filter(x=>!existing.has(x.sourceUid));if(!additions.length){status.textContent='모두 이미 등록되어 있습니다. 추가 0건.';return}if(!confirm(`기존 일정 ${latest.data.schedules.length}건을 보존하고 네이버 일정 ${additions.length}건을 추가할까요?`))return;status.textContent=`서버에 ${additions.length}건 저장 중... 화면을 닫지 마세요.`;const payload={...latest.data,schedules:[...latest.data.schedules,...additions]};const result=await cloudRPC('lm_cloud_write',{p_expected_version:latest.version,p_data:payload});if(!result||result.ok!==true)throw Error('다른 직원이 먼저 수정했습니다. 서버를 다시 조회해 재시도해 주세요.');db={...empty(),...payload};cloudVersion=result.version;cloudLastSaved=JSON.stringify(db);render();showSaveStatus(`네이버 일정 ${additions.length}건 공동 서버 저장 완료`,false);alert(`네이버 일정 ${additions.length}건 등록 완료. 기존 일정 ${latest.data.schedules.length}건 유지.\n반복 규칙은 원본 필드로 보관됩니다.`)}catch(e){status.textContent='등록 실패: '+e.message;showSaveStatus('캘린더 가져오기 실패: '+e.message,true)}finally{preview.disabled=false;const st=document.getElementById('naverIcsStatus');if(st&&st.textContent.includes('저장 중'))st.textContent='서버 저장이 완료되었습니다. 달력에서 확인해 주세요.'}}
}

let archiveState={customerPage:0,notePage:0,selected:null,customerQuery:'',noteQuery:'',section:'',noteId:null,searchSeq:0};
const ARCH_PAGE=30;
async function archiveAPI(table,params={},method='GET',body=null){
  await ensureFreshAuth();
  const url=new URL(SB_URL+'/rest/v1/'+table);
  for(const [k,v] of Object.entries(params))url.searchParams.set(k,v);
  const headers={'apikey':SB_KEY,'Authorization':'Bearer '+authToken};
  if(body!==null)headers['Content-Type']='application/json';
  if(method==='POST')headers['Prefer']='resolution=merge-duplicates,return=representation';
  if(method==='PATCH')headers['Prefer']='return=representation';
  if(method==='DELETE')headers['Prefer']='return=minimal';
  const r=await fetchWithTimeout(url.toString(),{method,headers,...(body!==null?{body:JSON.stringify(body)}:{})},25000);
  const raw=await r.text();let data;try{data=raw?JSON.parse(raw):[]}catch{data=raw}
  if(!r.ok)throw Error('서버 '+r.status+': '+(data?.message||data?.hint||String(raw).slice(0,220)));
  return data;
}

window.landmakerLoginClick=async()=>{const btn=document.getElementById('authSubmit'),err=document.getElementById('authError'),progress=document.getElementById('authProgress');if(btn.disabled)return;btn.disabled=true;btn.textContent='연결 중...';err.textContent='';progress.textContent='① Supabase 로그인 서버에 연결 중...';try{const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value;try{if(document.getElementById('rememberEmail').checked)localStorage.setItem('landmaker-remember-email',email);else localStorage.removeItem('landmaker-remember-email')}catch(_){}if(!email){throw Error('직원 이메일을 먼저 입력해 주세요.')}if(!password){throw Error('비밀번호를 먼저 입력해 주세요.')}const r=await fetchWithTimeout(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const j=await r.json();if(!r.ok||!j.access_token)throw Error(j.msg||j.error_description||j.message||'이메일·비밀번호 또는 이메일 인증 상태를 확인하세요. (HTTP '+r.status+')');progress.textContent='② 로그인 성공, 직원 권한 확인 중...';await activateAuth(j.access_token);setAuthSession(j);document.getElementById('authPassword').value='';progress.textContent='로그인 성공'}catch(ex){console.error('로그인 실패',ex);err.textContent=authMessage(ex);progress.textContent='로그인 실패 · 아래 오류 내용을 확인하세요.';openAuth()}finally{btn.disabled=false;btn.textContent='로그인'}};
document.getElementById('authLogout').onclick=async()=>{const t=authToken;if(cloudPoll)clearInterval(cloudPoll);clearAuthSession();openAuth();document.getElementById('authPassword').value='';if(t){try{await fetch(SB_URL+'/auth/v1/logout',{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+t}})}catch(e){console.warn('로그아웃 서버 요청 실패',e)}}};
// IndexedDB: offline-only local persistence. This is NOT multi-PC sync.
const OFFLINE_DB='landmaker-offline-v1';let offlineConn=null,offlineQueue=Promise.resolve();
function offlineOpen(){return new Promise((resolve,reject)=>{const r=indexedDB.open(OFFLINE_DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('data'))r.result.createObjectStore('data')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function offlineRead(){return new Promise((resolve,reject)=>{const t=offlineConn.transaction('data','readonly');const r=t.objectStore('data').get('snapshot');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function offlineWrite(payload){return new Promise((resolve,reject)=>{const t=offlineConn.transaction('data','readwrite');t.objectStore('data').put(payload,'snapshot');t.oncomplete=()=>resolve();t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error)})}
function offlineSave(){const snapshot=db;offlineQueue=offlineQueue.catch(()=>{}).then(()=>offlineWrite({data:snapshot,at:new Date().toISOString()})).then(()=>showSaveStatus('이 PC에 오프라인 저장 완료',false)).catch(e=>showSaveStatus('로컬 저장 실패: '+e.message,true));return offlineQueue}
window.addEventListener('error',e=>showSaveStatus('화면 오류: '+e.message,true));window.addEventListener('unhandledrejection',e=>showSaveStatus('처리 오류: '+String(e.reason),true));
// 웹용: 로컬 자료를 자동으로 올리거나 오프라인 모드로 우회하지 않습니다.
(async()=>{
 openAuth();
 const progress=document.getElementById('authProgress');
 try{
  const email=localStorage.getItem('landmaker-remember-email');
  if(email){document.getElementById('authEmail').value=email;document.getElementById('rememberEmail').checked=true}
  const preference=localStorage.getItem(AUTO_PREF_KEY);
  const saved=localStorage.getItem(AUTO_KEY);
  // 이전 버전에서 체크한 자동로그인을 그대로 복원한다. 새 사용자에게는 기본적으로 켠다.
  document.getElementById('autoLogin').checked=preference!=='no';
  document.getElementById('autoLogin').addEventListener('change',()=>persistAuthSession());
  if(saved && preference!=='no'){
   const session=JSON.parse(saved);
   if(session && typeof session.refresh_token==='string' && session.refresh_token){
    authRefreshToken=session.refresh_token;
    authExpiresAt=Number(session.expires_at)||0;
    progress.textContent='저장된 로그인 복원 중…';
    try{
     const token=await refreshAuthSession();
     await activateAuth(token);
     progress.textContent='로그인 상태가 복원되었습니다.';
     return;
    }catch(ex){
     console.warn('로그인 자동 복원 실패',ex);
     // 네트워크 장애는 토큰 만료가 아니다. 명백한 무효 토큰에만 저장 정보 제거.
     if(/만료|invalid|refresh.token|400|401/i.test(String(ex.message||''))){clearAuthSession()}
     authToken=null;cloudReady=false;
     progress.textContent='자동 로그인에 실패했습니다. 로그인 버튼으로 다시 시도해 주세요.';
    }
   }
  }
 }catch(ex){console.warn('로그인 복원 준비 실패',ex)}
 if(!progress.textContent || progress.textContent==='버튼을 누르면 연결 상태가 표시됩니다.')progress.textContent='직원 계정으로 로그인하면 Supabase 공동자료를 불러옵니다.';
})();
</script><script>
/* v12.7 mobile navigation: no changes to existing data or Supabase logic */
(function(){
 const menu=document.getElementById('lmMobileMenu');
 const nav=document.getElementById('nav');
 const backdrop=document.getElementById('lmMobileBackdrop');
 if(!menu||!nav||!backdrop)return;
 function close(){document.body.classList.remove('lm-mobile-nav-open');menu.setAttribute('aria-expanded','false');menu.setAttribute('aria-label','메뉴 열기')}
 menu.addEventListener('click',function(){const open=document.body.classList.toggle('lm-mobile-nav-open');menu.setAttribute('aria-expanded',String(open));menu.setAttribute('aria-label',open?'메뉴 닫기':'메뉴 열기')});
 backdrop.addEventListener('click',close);
 nav.addEventListener('click',function(e){if(e.target.closest('button,a'))close()});
 document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
 window.addEventListener('resize',function(){if(window.innerWidth>767)close()});
})();
</script></body></html>
